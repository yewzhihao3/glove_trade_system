# Alembic Configuration File
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# path to migration scripts
script_location = alembic

# The DATABASE_URL is overridden dynamically in env.py from the environment variable.
# This value here is just a placeholder — do NOT rely on it for production.
sqlalchemy.url = sqlite:///./trade_intelligence.db

[post_write_hooks]
# (optional) hooks after new migration scripts are generated

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
